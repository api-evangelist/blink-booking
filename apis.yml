name: Blink Booking
description: 'Blink Booking was a Madrid, Spain based mobile application for last-minute
  hotel booking, founded in 2011 by Rebeca Minguela and Miguel Ortega Rodriguez. The
  app presented travellers with a curated daily selection of four discounted hotels
  for same-day stays, working with more than 2,000 hotel partners across eight European
  countries, and competed directly with HotelTonight. The company raised approximately
  $2.5M in a Series A round in May 2012 from Ventech, Uncork Capital (then SoftTech
  VC), 500 Global (then 500 Startups) and Kibo Ventures. Groupon acquired Blink Booking
  in September 2013 to strengthen its Groupon Getaways travel division; the app was
  rebranded "Blink by Groupon" and was wound down over the following months. The company
  is defunct and publishes no developer surface, no API, and no documentation. Its
  former blinkbooking.com domain lapsed and was re-registered in August 2020 by an
  unrelated party; it now redirects to a third-party gambling site and must not be
  treated as a company property.'
